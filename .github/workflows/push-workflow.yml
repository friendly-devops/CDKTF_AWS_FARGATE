name: "Push Workflow"

on:
  push:
    branches:
    - "*"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true


jobs:
  tf_deployment:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.12.0
      - name: install dependencies
        run: |
          npm install --force
          npm install -g cdktf-cli@latest --force
      - name: CDKTF Synth
        run: |
          cdktf --app "npx ts-node main.ts" synth
        env:
          USER: ${{ secrets.DB_USER }}
          PASS: ${{ secrets.DB_PASS }}
          VPC_ID: ${{ secrets.VPC_ID }}
          STATE_BUCKET: ${{ secrets.AWS_STATE_BUCKET }}
          SUBNET: ${{ secrets.SUBNET_ID }}
          SUBNET_2: ${{ secrets.SUBNET_TWO }}
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          ZONEID: ${{ secrets.ZONEID }}
